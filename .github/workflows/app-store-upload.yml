name: "🛍️ CD · App Store Upload"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@d95ac8aad0332a530cd76eb875f9380a88e4c531
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
      version: ${{ inputs.version }}
    secrets: inherit

  upload:
    needs: package
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@d95ac8aad0332a530cd76eb875f9380a88e4c531
    with:
      app_name: Sentrio
    secrets:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
