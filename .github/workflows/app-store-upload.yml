name: "🛍️ CD · App Store Upload"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@6c254c34cccee8f75f5baa0f63dc3b5376cd24f2
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
    secrets: inherit

  upload:
    needs: package
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@172316ba468bd7bbdf0d57ea28856d68b7aacb2e
    with:
      app_name: Sentrio
    secrets:
      APP_STORE_CONNECT_API_KEY: ${{ secrets.MACOS_NOTARY_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
