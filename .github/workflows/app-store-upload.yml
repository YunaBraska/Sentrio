name: "🛍️ CD · App Store Upload"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@36fe519dd7cafbcaf9570a0e94b15116345bcdc6
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
      version: ${{ inputs.version }}
    secrets: inherit

  upload:
    needs: package
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store_upload.yml@36fe519dd7cafbcaf9570a0e94b15116345bcdc6
    with:
      app_name: Sentrio
    secrets: inherit
