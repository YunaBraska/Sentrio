name: "🛍️ CD · App Store"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@953cba440c761df127b9384cd757a1b3eb4b7018
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
      version: ${{ inputs.version }}
    secrets: inherit
