name: "🛍️ CD · App Store"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@15af7c6cd91a54d9b4738851792affff72625294
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
      version: ${{ inputs.version }}
    secrets: inherit
