name: "🛍️ CD · App Store"

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_macos_app_store.yml@d95ac8aad0332a530cd76eb875f9380a88e4c531
    with:
      app_name: Sentrio
      bundle_id: berlin.yuna.sentrio
      version: ${{ inputs.version }}
    secrets: inherit
