name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@d95ac8aad0332a530cd76eb875f9380a88e4c531
    with:
      ref: ${{ github.sha }}
