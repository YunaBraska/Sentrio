name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@469372e592d87a003dbfae15ef8d50194bcea7e5
    with:
      ref: ${{ github.sha }}
