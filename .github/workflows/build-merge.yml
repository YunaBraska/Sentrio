name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@0db2a7b5870d2aa7a228386410fa7bee83ec6622
    with:
      ref: ${{ github.sha }}
