name: "🔄 CD · Release Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@0c16fe69a5b69ad9da903c444f855b19d4d555fc
    with:
      ref: ${{ github.sha }}
