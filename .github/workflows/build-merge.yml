name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@1ebb6d9e98930d0ede2aaf9bf0c648010d44d66e
    with:
      ref: ${{ github.sha }}
