name: "🔄 CD · Snapshot"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.sha }}
  cancel-in-progress: false

jobs:
  snapshot:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_snapshot.yml@a989b376b6f85e9643c12231a44640036f8ad1c2
    with:
      ref: ${{ github.sha }}
