name: 🧩 CI · Merge

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sentrio-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@c2ae1aca39fb67b776e6164304c5e24c508992e1
    with:
      ref: ${{ github.sha }}
      dry_run: true
      upload_artifact: true
    secrets: inherit
