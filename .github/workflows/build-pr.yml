name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@8f8c0c45ee7e939249d7442eba0192ca0c97f4e4
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
