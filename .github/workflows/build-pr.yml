name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@4bbf9f8a3f6848f08be3e00ab05e39702cd95aaf
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
