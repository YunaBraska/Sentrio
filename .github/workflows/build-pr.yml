name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@0efa5d3b275e474e54af0ced8ba1a771f6b9df7c
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
