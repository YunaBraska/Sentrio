name: "🔍 CI · Pull Request"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - README.md
      - docs/**
      - doc/**
      - .github/workflows/product-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@c50354ba274461b06a13b961d219629d3bb57ae2
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
