name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@de3fb68d612620fa4761337b413d7f90f75c8765
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
