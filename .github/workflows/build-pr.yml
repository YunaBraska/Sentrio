name: "🔍 CI · Pull Request"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@29bd56f4cc120be2bdcab1b484c34fae14c51b35
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
