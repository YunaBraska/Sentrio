name: 🧩 CI · Pull Request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: sentrio-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_build_common.yml@5e556f8baa1d8a5c2dc8b13029b720818db28124
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit
