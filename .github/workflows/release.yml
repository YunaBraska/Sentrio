# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@4bbf9f8a3f6848f08be3e00ab05e39702cd95aaf
    with:
      force: ${{ inputs.force }}
    secrets: inherit
