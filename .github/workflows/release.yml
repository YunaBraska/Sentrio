# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@0efa5d3b275e474e54af0ced8ba1a771f6b9df7c
    with:
      force: ${{ inputs.force }}
    secrets: inherit
