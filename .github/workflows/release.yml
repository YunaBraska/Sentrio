# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@8dd69a07a51f800bdcde8d8e63f72e6b68edcae8
    with:
      force: ${{ inputs.force }}
    secrets: inherit
