# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@e2f87d3972fef060dd16a9643d892f16cfa07d86
    with:
      force: ${{ inputs.force }}
      macos_update_public_key: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
    secrets: inherit
