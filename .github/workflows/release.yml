# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean
      version:
        description: Version.
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@3a2fa32fe739e59bf8fb8d5a8e2c6a5516722a11
    with:
      force: ${{ inputs.force }}
      version: ${{ inputs.version }}
      macos_update_public_key: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
    secrets: inherit
