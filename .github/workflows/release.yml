# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@333d4936da319aa8eeb6f10dcb43d5dc5b8c2f3e
    with:
      force: ${{ inputs.force }}
      macos_update_public_key: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
    secrets: inherit
