# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    uses: YunaBraska/YunaBraska/.github/workflows/wc_swift_release.yml@8f8c0c45ee7e939249d7442eba0192ca0c97f4e4
    with:
      force: ${{ inputs.force }}
    secrets: inherit
